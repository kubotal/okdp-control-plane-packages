apiVersion: v1alpha1
name: spark-operator
tag: 0.3.0
protected: false
description: |
  Kubeflow Spark Operator - Cluster-wide Kubernetes operator for managing Apache Spark applications.
  Installed once as platform infrastructure, watches all namespaces for SparkApplication CRs.
schema:
  parameters:
    properties:
      controllerReplicas:
        type: integer
        default: 1
        description: "Number of controller replicas"
        title: "Controller | Replicas | stepper | order:1"
        minimum: 1
        maximum: 5
      controllerLogLevel:
        type: string
        default: "info"
        description: "Controller log verbosity"
        title: "Controller | Log Level | | order:2"
        enum: ["info", "debug", "error"]
      controllerWorkers:
        type: integer
        default: 10
        description: "Number of concurrent reconciliation workers"
        title: "Controller | Workers | stepper | order:3 advanced:true"
        minimum: 1
        maximum: 100
      metricsEnabled:
        type: boolean
        default: false
        description: "Enable Prometheus metrics endpoint"
        title: "Monitoring | Metrics Enabled | | order:1 advanced:true"
  context:
    properties:
      sparkOperator:
        required: true
        properties:
          image:
            required: true
            properties:
              registry: { type: string, required: true }
              repository: { type: string, required: true }
              tag: { type: string, required: true }
modules:
  - name: main
    timeout: 10m
    source:
      helmRepository:
        url: https://kubeflow.github.io/spark-operator
        chart: spark-operator
        version: 2.5.0
    values: |
      image:
        registry: "{{ .Context.sparkOperator.image.registry }}"
        repository: "{{ .Context.sparkOperator.image.repository }}"
        tag: "{{ .Context.sparkOperator.image.tag }}"
        pullPolicy: IfNotPresent

      controller:
        replicas: {{ .Parameters.controllerReplicas }}
        logLevel: "{{ .Parameters.controllerLogLevel }}"
        workers: {{ .Parameters.controllerWorkers }}
        serviceAccount:
          create: true
        rbac:
          create: true
        leaderElection:
          enable: true
        uiService:
          enable: true
        uiIngress:
          enable: false

      webhook:
        enable: false

      spark:
        jobNamespaces:
          - ""
        serviceAccount:
          create: true
        rbac:
          create: true

      prometheus:
        metrics:
          enable: {{ .Parameters.metricsEnabled }}
          port: 8080
          endpoint: /metrics
roles: []
dependencies: []

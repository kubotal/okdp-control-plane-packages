{{- /*
  SeaweedFS s3 component reads identities from a JSON file (default path
  /etc/sw/seaweedfs_s3_config) mounted from this Secret. The schema is
  documented at:
  https://github.com/seaweedfs/seaweedfs/wiki/Amazon-S3-API#static-configuration
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName }}
type: Opaque
stringData:
  seaweedfs_s3_config: |
    {
      "identities": [
        {
          "name": "{{ .Values.accessKey }}",
          "credentials": [
            {
              "accessKey": "{{ .Values.accessKey }}",
              "secretKey": "{{ .Values.secretKey }}"
            }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }

apiVersion: v1alpha1
name: seaweedfs
tag: 0.1.0
protected: false
description: |
  SeaweedFS distributed object storage — S3-compatible API for the platform.
  Deployed once at cluster bootstrap as **infrastructure** (like vault), NOT
  exposed in the UI's deploy wizard. Used by Spark/Polaris/Trino for Iceberg
  warehouses, event logs, datasets.
usage:
  text: |
    SeaweedFS S3 endpoint: https://seaweedfs.{{ .Context.ingress.suffix }}
    Use the admin credentials from the bootstrap manifest as access_key / secret_key.
schema:
  parameters:
    properties:
      accessKey:
        type: string
        default: "okdp-admin"
        description: "S3 access key (admin)"
      secretKey:
        type: string
        default: "okdp-admin-secret-change-me"
        description: "S3 secret key (admin). CHANGE IN PROD."
      volumeSize:
        type: string
        default: "10Gi"
        description: "Volume server storage size"
      filerSize:
        type: string
        default: "2Gi"
        description: "Filer leveldb storage size"
  context:
    properties:
      certificateIssuers:
        required: true
        properties:
          selfSigned:
            properties:
              name: { type: string, required: true }
      ingress:
        required: true
        properties:
          suffix: { type: string, required: true }
          className: { type: string, required: true }
modules:
  - name: s3-creds
    source:
      local:
        path: charts/s3-creds
    values: |
      secretName: "{{ .Release.metadata.name }}-s3-creds"
      accessKey: "{{ .Parameters.accessKey }}"
      secretKey: "{{ .Parameters.secretKey }}"

  - name: seaweedfs
    dependsOn:
      - s3-creds
    timeout: 10m
    source:
      helmRepository:
        url: https://seaweedfs.github.io/seaweedfs/helm
        chart: seaweedfs
        version: 4.17.0
    values: |
      {{- $host := printf "seaweedfs.%s" .Context.ingress.suffix -}}

      image:
        repository: chrislusf/seaweedfs
        tag: "4.17"

      master:
        replicas: 1
        data:
          type: persistentVolumeClaim
          size: 1Gi
        logs:
          type: persistentVolumeClaim
          size: 500Mi
        disableHttp: false

      volume:
        replicas: 1
        data:
          type: persistentVolumeClaim
          size: "{{ .Parameters.volumeSize }}"

      filer:
        replicas: 1
        data:
          type: persistentVolumeClaim
          size: "{{ .Parameters.filerSize }}"
        logs:
          type: persistentVolumeClaim
          size: 500Mi
        s3:
          enabled: false

      s3:
        enabled: true
        replicas: 1
        auth:
          enabled: true
          existingSecret: "{{ .Release.metadata.name }}-s3-creds"

      cosi:
        enabled: false

      ingress:
        enabled: true
        className: "{{ .Context.ingress.className }}"
        host: "{{ $host }}"
        annotations:
          cert-manager.io/cluster-issuer: "{{ .Context.certificateIssuers.selfSigned.name }}"
          nginx.ingress.kubernetes.io/proxy-body-size: "0"
          nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
        tls:
          - secretName: "{{ .Release.metadata.name }}-tls"
            hosts:
              - "{{ $host }}"

# Note: `system` role keeps this package out of the UI's platform-services
# list (Context.okdp.services is the registry of UI-deployable packages).
roles:
  - system
dependencies:
  - ingress

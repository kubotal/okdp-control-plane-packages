{{- /*
  Preserve the existing secret value on reconciles. Without this lookup,
  every Flux reconcile rotates the shared-secret and breaks the Trino
  coordinator <-> worker auth handshake mid-cluster.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.secretName -}}
{{- $secret := "" -}}
{{- if and $existing $existing.data (index $existing.data .Values.key) -}}
  {{- $secret = index $existing.data .Values.key | b64dec -}}
{{- end -}}
{{- if not $secret -}}
  {{- $secret = randAlphaNum 64 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName }}
type: Opaque
stringData:
  {{ .Values.key }}: {{ $secret | quote }}

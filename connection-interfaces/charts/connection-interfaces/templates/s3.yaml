{{- /*
  Contract for S3-compatible object storage (AWS S3, MinIO, SeaweedFS, ...).

  accessKey is part of the contract because a key ID is not a credential on its
  own; the secret access key is not, and lives in the referenced Secret.
*/}}
apiVersion: kubocd.kubotal.io/v1alpha1
kind: {{ .Values.interfaceKind }}
metadata:
  name: s3
spec:
  description: S3-compatible object storage
  schema:
    type: object
    properties:
      endpoint:
        type: string
        required: true
      bucket:
        type: string
        required: true
      region:
        type: string
        default: us-east-1
      accessKey:
        type: string
        required: true
      pathStyle:
        type: boolean
        default: true
      # How a consumer reaches the credentials: the name of the Kubernetes
      # Secret holding them, never the values. The chart binds them with a
      # normal secretKeyRef, so they are injected by Kubernetes at pod start.
      credentialsSecret:
        type: string
      # Fingerprint of those credentials. Rotating them changes this value,
      # which changes the Connection, which re-reconciles every Release bound
      # to it — nothing else would notice a Secret-only change.
      credentialsVersion:
        type: string

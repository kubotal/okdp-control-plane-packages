{{- /*
  Contract for a MySQL or MariaDB server a project connects to.
  As for PostgreSQL, the password lives in a Secret and not in spec.values.
*/}}
apiVersion: kubocd.kubotal.io/v1alpha1
kind: {{ .Values.interfaceKind }}
metadata:
  name: mysql
spec:
  description: MySQL or MariaDB database server
  schema:
    type: object
    properties:
      host:
        type: string
        required: true
      port:
        type: integer
        required: true
        default: 3306
      database:
        type: string
        required: true
      user:
        type: string
        required: true
      tls:
        type: string
        required: true
        default: preferred
      # How a consumer reaches the credentials: the name of the Kubernetes
      # Secret holding them, never the values. The chart binds them with a
      # normal secretKeyRef, so they are injected by Kubernetes at pod start.
      credentialsSecret:
        type: string
      # Fingerprint of those credentials. Rotating them changes this value,
      # which changes the Connection, which re-reconciles every Release bound
      # to it — nothing else would notice a Secret-only change.
      credentialsVersion:
        type: string

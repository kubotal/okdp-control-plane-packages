{{- /*
  Contract for a PostgreSQL server a project connects to.

  The properties are exactly what the Control Plane writes to a Connection's
  spec.values — the password is deliberately absent: credentials are stored in
  a Kubernetes Secret the Connection references through the
  okdp.io/credentials-secret annotation, never in the resource itself.
*/}}
apiVersion: kubocd.kubotal.io/v1alpha1
kind: {{ .Values.interfaceKind }}
metadata:
  name: postgresql
spec:
  description: PostgreSQL database server
  schema:
    type: object
    properties:
      host:
        type: string
        required: true
      port:
        type: integer
        required: true
        default: 5432
      database:
        type: string
        required: true
      user:
        type: string
        required: true
      sslMode:
        type: string
        required: true
        # libpq's own default, and the Control Plane's: try TLS, fall back to
        # clear text if the server refuses it. A server outside the cluster is
        # often reachable no other way.
        default: prefer
      # How a consumer reaches the credentials: the name of the Kubernetes
      # Secret holding them, never the values. The chart binds them with a
      # normal secretKeyRef, so they are injected by Kubernetes at pod start.
      credentialsSecret:
        type: string
      # Fingerprint of those credentials. Rotating them changes this value,
      # which changes the Connection, which re-reconciles every Release bound
      # to it — nothing else would notice a Secret-only change.
      credentialsVersion:
        type: string

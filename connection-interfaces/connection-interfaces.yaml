apiVersion: v1alpha1
name: connection-interfaces
tag: 0.1.0
protected: true
description: |
  Connection contracts for the external resources a project declares from the
  OKDP console: PostgreSQL, MySQL/MariaDB and S3-compatible object storage.

  Each contract is a KuboCD Interface whose schema validates the values of the
  Connections created against it. Without them a Connection is accepted but
  reconciles to "Interface <type> unknown", so this is installed once as
  platform infrastructure, next to the other cluster-wide pieces.

  The schemas match what the Control Plane writes: credentials are absent by
  design, they live in a Kubernetes Secret the Connection references through
  its okdp.io/credentials-secret annotation.
usage:
  text: |
    Connections can now be declared from a project's Connections page.
schema:
  parameters:
    properties:
      interfaceKind:
        type: string
        default: "Interface"
        enum: ["Interface", "ClusterInterface"]
        description: >-
          Kind of the contract objects. These contracts are not tied to a
          namespace, so they belong on the cluster-scoped kind: that is
          "Interface" on the KuboCD version deployed today, and
          "ClusterInterface" once Interface becomes namespaced.
        title: "Contracts | Interface kind | | order:1 advanced:true"
modules:
  - name: interfaces
    source:
      local:
        path: charts/connection-interfaces
    values: |
      interfaceKind: "{{ .Parameters.interfaceKind }}"
roles: []
dependencies: []

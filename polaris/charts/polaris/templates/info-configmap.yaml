apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-info-page
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Apache Polaris</title>
      <meta name="viewport" content="width=device-width,initial-scale=1">
      <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fafbfc;color:#1f2328;line-height:1.6;padding:60px 24px;min-height:100vh}
        .c{max-width:680px;margin:0 auto}
        h1{font-size:32px;margin-bottom:8px}
        .s{color:#656d76;font-size:16px;margin-bottom:32px}
        .k{background:#fff;border:1px solid #d0d7de;border-radius:8px;padding:24px;margin-bottom:16px}
        h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#656d76;margin-bottom:12px}
        code{background:#f6f8fa;padding:2px 6px;border-radius:4px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
        pre{background:#f6f8fa;padding:14px 18px;border-radius:6px;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
        ul{list-style:none}
        li{padding:10px 0;border-bottom:1px solid #f0f2f4}
        li:last-child{border:none}
        li strong{display:inline-block;min-width:64px;color:#1f2328}
        a{color:#0969da;text-decoration:none}
        a:hover{text-decoration:underline}
        .d{display:inline-block;width:8px;height:8px;border-radius:50%;background:#1a7f37;margin-right:8px;vertical-align:middle}
      </style>
    </head>
    <body>
      <div class="c">
        <h1>Apache Polaris</h1>
        <p class="s"><span class="d"></span>Iceberg REST Catalog &middot; API service</p>

        <div class="k">
          <h2>API endpoint</h2>
          <pre>https://{{ .Values.ingress.host }}/api/catalog/v1</pre>
        </div>

        <div class="k">
          <h2>Access</h2>
          <p style="color:#656d76;margin-bottom:14px">No web UI &mdash; clients authenticate with OIDC bearer tokens from kubauth.</p>
          <ul>
            <li><strong>Trino</strong>iceberg connector with <code>iceberg.catalog.type=rest</code></li>
            <li><strong>Spark</strong><code>spark.sql.catalog.&lt;name&gt;.type=rest</code></li>
            <li><strong>curl</strong><code>curl -H "Authorization: Bearer $TOKEN" /api/catalog/v1/config</code></li>
          </ul>
        </div>

        <div class="k">
          <h2>Documentation</h2>
          <p><a href="https://polaris.apache.org/" target="_blank" rel="noopener">polaris.apache.org</a></p>
        </div>
      </div>
    </body>
    </html>
